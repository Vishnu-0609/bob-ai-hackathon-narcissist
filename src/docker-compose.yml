services:
  backend:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite:///./dvi.db
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173"]'
      GEMINI_MODEL: gemini-2.5-flash
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
