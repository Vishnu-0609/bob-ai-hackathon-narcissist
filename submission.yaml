submission:
  title: "DVI Coordinator — Disaster Victim Identification"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    After mass-casualty incidents like the June 2023 Balasore train collision
    (293 deaths), NDRF teams manually cross-referenced 100+ unidentified bodies
    against missing-person reports over 72 hours with no unified matching
    system — a slow, error-prone process during a window when physical evidence
    is actively decomposing and grieving families need answers.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    A DVI coordination tool where field teams log ante-mortem (family-reported)
    and post-mortem (mortuary-recorded) profiles. A deterministic, weighted
    scoring engine ranks the top 3 candidate matches per unidentified body,
    while an IBM Bob-built agent extracts structured features from free-text/
    voice family narratives, writes human-readable match rationale, and
    drafts the final reconciliation report for forensic sign-off.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Weighted, time-decay-aware match-probability scoring engine (dental/DNA > scars/tattoos > clothing, with confidence decaying as post-mortem hours increase)"
    - "Bob-powered free-text/voice intake parser that structures family narratives into AM profile fields without requiring rigid forms"
    - "Bob-powered rationale generator producing plain-language 'why this match' explanations for each of the top 3 candidates"
    - "Auto-generated reconciliation report (PDF) with full field-by-field rationale, ready for forensic coordinator confirmation"
    - "Immutable audit log of every match decision, override, and confirmation for legal/compensation traceability"

  tech_stack:
    languages: ["Python", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "watsonx Orchestrate"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker", "Docker Compose"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The scoring engine models forensic reality rather than treating all
    fields equally — dental and DNA evidence dominate when available, but
    physical-description confidence is decayed over elapsed post-mortem
    time, reflecting how identifying features actually degrade in the first
    72 hours, which is when most real DVI decisions have to be made.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    DNA/dental fields are schema placeholders and not integrated with real
    lab systems. Time-decay weighting is an estimated heuristic, not
    clinically validated. Duplicate-family-report detection uses basic
    text-similarity matching rather than verified identity resolution.
    Multilingual voice intake currently supports English/Hindi text input;
    live Odia voice transcription was out of scope for the hackathon window.

